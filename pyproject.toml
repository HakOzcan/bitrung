[project]
name = "bitrung"
version = "0.1.0"
description = "Turn video files into adaptive HLS streams."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hakan Özcan", email = "122551584+HakOzcan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
bitrung = "bitrung:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
